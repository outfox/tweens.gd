name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Package version supplied by the release tag.
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Library jobs run for changes outside docs/; the docs job also checks shared JavaScript utilities.
  # Manual runs, release tags, new branches, and history the diff can't reach run everything.
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      library: ${{ steps.classify.outputs.library }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          range=
          if [[ $EVENT == pull_request ]]; then
            range="$PR_BASE...$PR_HEAD"
          elif [[ $EVENT == push && $REF_TYPE == branch && -n $PUSH_BASE && ! $PUSH_BASE =~ ^0+$ ]]; then
            range="$PUSH_BASE...$GITHUB_SHA"
          fi
          library=true
          docs=true
          if [[ -n $range ]] && files=$(git diff --name-only "$range"); then
            library=false
            docs=false
            while IFS= read -r file; do
              case $file in
                '') ;;
                docs/*) docs=true ;;
                addons/tweens_gd/* | csharp/* | tests/conformance/* | scripts/*.mjs | scripts/.prettierrc.json | .github/workflows/ci.yml) library=true; docs=true ;;
                *) library=true ;;
              esac
            done <<< "$files"
          fi
          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "Range: ${range:-everything}. Library jobs: $library. Docs job: $docs." >> "$GITHUB_STEP_SUMMARY"

  # Build and rendering need this job, so they skip with it.
  gdextension:
    name: GDExtension
    needs: changes
    if: needs.changes.outputs.library == 'true'
    uses: ./.github/workflows/gdextension.yml

  build:
    name: Build, test, and pack
    needs: gdextension
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Staged test projects and the addon package take every platform's library from here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gdextension-*
          path: addons/tweens_gd/bin
          merge-multiple: true
      - name: Resolve package version
        env:
          RELEASE_VERSION: ${{ inputs.package-version }}
        run: |
          $version = $env:RELEASE_VERSION
          if (!$version) {
            $project = [xml](Get-Content csharp/tweens.gd.csproj -Raw)
            $version = $project.Project.PropertyGroup.Version
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore tweens.gd.slnx -p:Configuration=Release
      - name: Check release failure handling
        run: ./.github/scripts/Test-ReleasePublishing.ps1
      - name: Build
        run: dotnet build tweens.gd.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION
      - name: Build library lifecycle tests
        run: dotnet build tests/tweens.gd.tests/tweens.gd.tests.csproj -c Release --no-restore -p:TestSuite=Lifecycle -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION
      - name: Test
        run: dotnet test testbed/testbed.tests/testbed.tests.csproj -c Release --no-build --no-restore --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/test-results
      - name: Test playground
        run: dotnet test playground/playground.tests/playground.tests.csproj -c Release --logger 'trx;LogFileName=playground.trx' --results-directory artifacts/test-results
      - name: Test tutorial
        run: dotnet test tutorial/tutorial.tests/tutorial.tests.csproj -c Release --logger 'trx;LogFileName=tutorial.trx' --results-directory artifacts/test-results
      - name: Test library with coverage
        run: dotnet msbuild build/Coverage.proj -p:Configuration=Release -p:NoBuild=true
      # Godot 4.7 projects target net8.0 and roll forward; run the library's net8.0 build on .NET 10 the same way.
      - name: Test library net8.0 build
        run: dotnet test tests/tweens.gd.tests/tweens.gd.tests.csproj -c Release --no-restore -p:LibraryFramework=net8.0 -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION --logger 'trx;LogFileName=library-net8.0.trx' --results-directory artifacts/test-results
      - name: Run headless testbed
        timeout-minutes: 2
        run: dotnet run --project testbed/testbed.2dog -c Release --no-build --no-restore -- --headless --quit-after 12
      - name: Test pure GDScript addon
        timeout-minutes: 2
        run: dotnet run --project testbed-gdscript/host -c Release --no-build --no-restore
      - name: Check GDScript helper catalog
        run: node scripts/generate-gdscript-catalog.mjs --check
      - name: Check addon UIDs
        run: ./scripts/Generate-AddonUids.ps1 -Check
      - name: Test GDScript debug validation
        timeout-minutes: 2
        run: dotnet run --project testbed-gdscript/host -c Debug --no-restore
      - name: Test GDScript engine restarts
        timeout-minutes: 2
        run: dotnet run --project testbed-gdscript/host -c Release --no-build --no-restore -- --lifecycle
      # GDScript warnings exist only in debug builds; the gallery project makes Godot's defaults errors.
      - name: Check gallery GDScript warnings
        timeout-minutes: 5
        run: dotnet test testbed/testbed.tests/testbed.tests.csproj -c Debug --filter "FullyQualifiedName~GalleryLanguageTests"
      - name: Check tutorial GDScript warnings
        timeout-minutes: 5
        run: dotnet test tutorial/tutorial.tests/tutorial.tests.csproj -c Debug
      - name: Pack
        run: dotnet pack csharp/tweens.gd.csproj -c Release --no-build --no-restore -p:ContinuousIntegrationBuild=true -p:Version=$env:PACKAGE_VERSION -o artifacts/packages
      - name: Pack unified Godot Asset Store addon
        run: ./scripts/Pack-Addon.ps1 -Version $env:PACKAGE_VERSION
      - name: Pack standalone tutorial project
        run: ./scripts/Pack-Tutorial.ps1 -Version $env:PACKAGE_VERSION
      - name: Verify packages and smoke test the addon with 2dog
        timeout-minutes: 5
        run: dotnet msbuild build/Smoke.proj -p:Version=$env:PACKAGE_VERSION
      - name: Smoke test the standalone tutorial project
        timeout-minutes: 5
        run: dotnet msbuild build/SmokeTutorial.proj
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tweens.gd-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/tweens.gd-${{ env.PACKAGE_VERSION }}.zip
            artifacts/packages/tweens.gd-tutorial.zip
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/coverage/**/*.trx
            artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  rendering:
    name: Rendering tests
    needs: gdextension
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gdextension-*
          path: addons/tweens_gd/bin
          merge-multiple: true
      # Godot renders on a virtual X display through Mesa's software drivers: lavapipe for Vulkan, llvmpipe for OpenGL.
      # Tests fail on any Godot warning, so audio gets ALSA's null device and Vulkan sees only lavapipe.
      - name: Install software rendering
        run: |
          sudo apt-get update
          packages=(xvfb xauth mesa-vulkan-drivers libvulkan1 libgl1 libegl1 libgl1-mesa-dri libasound2t64
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0)
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          echo 'pcm.!default { type null }' > ~/.asoundrc
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if [ ${#icds[@]} -ne 1 ] || [ ! -f "${icds[0]}" ]; then echo "Expected one lavapipe ICD: ${icds[*]}"; exit 1; fi
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"
      - name: Test library rendering
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          dotnet test tests/tweens.gd.tests/tweens.gd.tests.csproj -c Release -p:TestSuite=Rendering --blame-hang-timeout 2m
          --logger 'trx;LogFileName=library-rendering.trx' --results-directory artifacts/test-results
      - name: Test testbed rendering
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          dotnet test testbed/testbed.tests/testbed.tests.csproj -c Release -p:RenderingTests=true --blame-hang-timeout 2m
          --logger 'trx;LogFileName=testbed-rendering.trx' --results-directory artifacts/test-results
      - name: Test playground rendering
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          dotnet test playground/playground.tests/playground.tests.csproj -c Release -p:RenderingTests=true --blame-hang-timeout 2m
          --logger 'trx;LogFileName=playground-rendering.trx' --results-directory artifacts/test-results
      - name: Test tutorial rendering
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          dotnet test tutorial/tutorial.tests/tutorial.tests.csproj -c Release -p:RenderingTests=true --blame-hang-timeout 2m
          --logger 'trx;LogFileName=tutorial-rendering.trx' --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendering-test-results
          path: |
            artifacts/test-results/*.trx
            **/TestResults/**/*.dmp
          if-no-files-found: ignore

  docs:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The C# example check compiles code fences against the library.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install
        run: npm ci
      - name: Check script formatting
        run: npm run check:script-format
      - name: Build site
        run: npm run build
      - name: Check links
        run: npm run check:links
      - name: Check easing
        run: npm run check:easing
      - name: Compile C# examples
        shell: pwsh
        run: ./scripts/Test-CSharpDocExamples.ps1
