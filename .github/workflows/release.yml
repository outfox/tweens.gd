name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag whose packages should be published to NuGet.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'outfox/tweens.gd'
    name: Validate release tag
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./.github/scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG

  build:
    needs: version
    if: github.repository == 'outfox/tweens.gd' && (github.event_name == 'push')
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ needs.version.outputs.version }}

  github-release:
    name: Upload GitHub release packages
    needs: [version, build]
    if: github.repository == 'outfox/tweens.gd' && (github.event_name == 'push')
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tweens.gd-packages
          path: packages
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: ./.github/scripts/Publish-GitHubRelease.ps1 -Tag $env:RELEASE_TAG -Prerelease:($env:PRERELEASE -eq 'true')

  nuget:
    name: Publish NuGet package
    needs: [version, build, github-release]
    # Manual runs use packages from an existing release; their build/upload jobs are skipped.
    if: >-
      github.repository == 'outfox/tweens.gd' &&
      (always() && needs.version.result == 'success' &&
      ((github.event_name == 'push' && needs.build.result == 'success' && needs.github-release.result == 'success') ||
      github.event_name == 'workflow_dispatch'))
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check publishing configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the NUGET_USER repository secret to the NuGet username that owns the trusted publishing policy.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download built packages
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tweens.gd-packages
          path: packages
      - name: Download existing release packages
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "v$env:PACKAGE_VERSION" --dir packages `
            --pattern "tweens.gd.$env:PACKAGE_VERSION.nupkg" `
            --pattern "tweens.gd.$env:PACKAGE_VERSION.snupkg"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the existing GitHub release packages.' }
      - name: Verify package files
        run: |
          foreach ($extension in 'nupkg', 'snupkg') {
            $path = "packages/tweens.gd.$env:PACKAGE_VERSION.$extension"
            if (!(Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Release package is missing or empty: $path"
            }
          }
      # The nuget.org policy matches outfox/tweens.gd and release.yml, without an environment.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushing the primary package also uploads its matching .snupkg.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/tweens.gd.$env:PACKAGE_VERSION.nupkg" `
            --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed (dotnet exit code $LASTEXITCODE)." }
