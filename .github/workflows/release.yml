name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ needs.version.outputs.version }}

  github-release:
    name: Upload GitHub release packages
    needs: [version, build]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tweens.gd-packages
          path: packages
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: ./.github/scripts/Publish-GitHubRelease.ps1 -Tag $env:RELEASE_TAG -Prerelease:($env:PRERELEASE -eq 'true')

  nuget:
    name: Publish to NuGet
    needs: github-release
    if: vars.NUGET_PUBLISH_ENABLED == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 5
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tweens.gd-packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Obtain a short-lived NuGet API key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: thygrrr
      - name: Publish package and symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
