name: GDExtension

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'outfox/tweens.gd'
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}${{ matrix.threads == 'no' && ' (no threads)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: x86_64, os: blacksmith-4vcpu-windows-2025 }
          - { platform: windows, arch: x86_32, os: blacksmith-4vcpu-windows-2025 }
          - { platform: windows, arch: arm64, os: blacksmith-4vcpu-windows-2025 }
          - { platform: linux, arch: x86_64, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: linux, arch: x86_32, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: linux, arch: arm64, os: blacksmith-4vcpu-ubuntu-2404-arm }
          - { platform: macos, arch: universal, os: blacksmith-6vcpu-macos-latest }
          - { platform: ios, arch: arm64, os: blacksmith-6vcpu-macos-latest }
          - { platform: android, arch: arm64, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: android, arch: arm32, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: android, arch: x86_64, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: android, arch: x86_32, os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: web, arch: wasm32, threads: 'yes', os: blacksmith-4vcpu-ubuntu-2404 }
          - { platform: web, arch: wasm32, threads: 'no', os: blacksmith-4vcpu-ubuntu-2404 }
    env:
      # Web side modules must match the Emscripten version godot-cpp 10 targets.
      EM_VERSION: 4.0.11
      # r28b; godot-cpp's default ndk_version, which it looks up under $ANDROID_HOME/ndk.
      NDK_VERSION: 28.1.13356709
      SCONS_VERSION: 4.10.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install SCons
        run: python -m pip install "scons==$SCONS_VERSION"
      - name: Install 32-bit toolchain
        if: matrix.platform == 'linux' && matrix.arch == 'x86_32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
      - name: Install Emscripten
        if: matrix.platform == 'web'
        run: |
          git clone --depth 1 --branch "$EM_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EM_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EM_VERSION"
      - name: Build debug and release libraries
        working-directory: gdextension
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          THREADS: ${{ matrix.threads || 'yes' }}
        run: |
          if [ "$PLATFORM" = web ]; then source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; fi
          for target in template_debug template_release; do
            scons -j4 platform="$PLATFORM" arch="$ARCH" target="$target" threads="$THREADS"
          done
          ls -la ../addons/tweens_gd/bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdextension-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.threads == 'no' && '-nothreads' || '' }}
          path: addons/tweens_gd/bin/
          if-no-files-found: error

  test:
    if: github.repository == 'outfox/tweens.gd'
    name: Test GDScript on ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: blacksmith-4vcpu-ubuntu-2404, asset: Godot_v4.7.2-stable_linux.x86_64.zip, godot: ./Godot_v4.7.2-stable_linux.x86_64 }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, asset: Godot_v4.7.2-stable_macos.universal.zip, godot: ./Godot.app/Contents/MacOS/Godot }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gdextension-*
          path: addons/tweens_gd/bin
          merge-multiple: true
      - name: Download Godot
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fsSLO "$base/$ASSET"
          curl -fsSL "$base/SHA512-SUMS.txt" | grep " $ASSET\$" > sums.txt
          if command -v sha512sum > /dev/null; then sha512sum -c sums.txt; else shasum -a 512 -c sums.txt; fi
          unzip -q "$ASSET"
      - name: Stage the addon
        run: |
          mkdir -p testbed-gdscript/addons testbed-gdscript/conformance
          cp -R addons/tweens_gd testbed-gdscript/addons/
          cp tests/conformance/*.json testbed-gdscript/conformance/
      - name: Test with the official Godot build
        env:
          GODOT: ${{ matrix.godot }}
        run: |
          # Godot 4.7.2 can crash on exit after registering an extension it found during the import (debug_draw_3d
          # does too). Tolerate only that crash, then require the registration it has already written.
          status=0
          "$GODOT" --headless --path testbed-gdscript --import || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -lt 128 ]; then
            echo "::error::The import failed with exit code $status."
            exit "$status"
          fi
          if ! grep -q tweens_gd.gdextension testbed-gdscript/.godot/extension_list.cfg 2>/dev/null; then
            echo "::error::The import did not register tweens_gd.gdextension (exit code $status)."
            exit 1
          fi
          "$GODOT" --headless --path testbed-gdscript -- --run-tests 2>&1 | tee run.log
          grep -qE 'GDScript: [0-9]+ checks, 0 failures\.' run.log
