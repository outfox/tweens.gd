[preset.0]
name="Windows Tests"
platform="Windows Desktop"
runnable=true
advanced_options=true
custom_features="tweens_test_export"
export_filter="all_resources"
include_filter="conformance/*.json"
exclude_filter="host/*,*.ps1,*.md"
export_path="../artifacts/gdscript-windows/tests.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="../artifacts/godot-templates/windows_debug_x86_64.exe"
custom_template/release="../artifacts/godot-templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Web Tests"
platform="Web"
runnable=true
advanced_options=true
custom_features="tweens_test_export"
export_filter="all_resources"
include_filter="conformance/*.json"
exclude_filter="host/*,*.ps1,*.md"
export_path="../artifacts/gdscript-web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug="../artifacts/godot-templates/web_debug.zip"
custom_template/release="../artifacts/godot-templates/web_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
